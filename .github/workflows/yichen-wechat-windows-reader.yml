name: yichen-wechat-windows-reader

on:
  pull_request:
    paths:
      - "yichen-wechat-windows-reader/**"
      - ".github/workflows/yichen-wechat-windows-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-clean-tree:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yichen-wechat-windows-reader/requirements.lock
      - name: Install hash-locked dependency
        run: python -m pip install --require-hashes -r yichen-wechat-windows-reader/requirements.lock
      - name: Run independent synthetic fixture tests
        run: python -m unittest discover -s yichen-wechat-windows-reader/tests -v
